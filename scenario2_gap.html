<!DOCTYPE html><html lang="zh-HK"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>股票投資 × 債券收息</title><style>
:root{--bg:#f8fafc;--card:#fff;--border:#e2e8f0;--text:#0f172a;--muted:#64748b;--blue:#2563eb;--green:#10b981;--red:#ef4444}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:20px 16px}.wrap{max-width:1040px;margin:auto}.switch{display:flex;width:330px;background:#e2e8f0;border-radius:10px;padding:4px;margin-bottom:18px}.switch button{flex:1;border:0;background:transparent;padding:9px;border-radius:7px;font-size:15px;cursor:pointer}.switch button.active{background:white;color:var(--blue);font-weight:650}.hero h1{font-size:27px;margin:0 0 7px}.hero p{margin:0 0 17px;color:var(--muted)}.card{background:white;border:1px solid var(--border);border-radius:14px;padding:17px}.inputs{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.field label{display:block;color:var(--muted);font-size:14px;margin-bottom:5px}.field input{width:100%;border:1px solid var(--border);border-radius:8px;padding:9px;font-size:17px;font-weight:600}.details-toggle{border:0;background:none;color:var(--blue);font-size:15px;padding:13px 0 4px;cursor:pointer}.details{display:none;border-top:1px solid #f1f5f9;margin-top:8px;padding-top:12px}.details.open{display:block}.year-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;max-height:260px;overflow:auto}.year-cell{background:#f8fafc;border:1px solid var(--border);border-radius:8px;padding:7px}.year-cell label{font-size:12px;color:var(--muted);display:block}.year-cell input{width:100%;margin-top:4px;border:1px solid var(--border);border-radius:5px;padding:5px;font-size:14px}.scenarios{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:16px}.scenario{border:1px solid var(--border);background:white;border-radius:10px;padding:11px;cursor:pointer;text-align:left}.scenario.active{border:2px solid var(--blue);background:#eff6ff}.scenario strong{display:block;font-size:15px}.scenario small{color:var(--muted)}.summary{display:flex;gap:25px;flex-wrap:wrap;margin-top:12px;font-size:14px}.summary strong{font-size:17px}.note{font-size:12px;color:var(--muted);margin-top:10px}.flow{display:grid;grid-template-columns:1fr 160px 1fr;gap:14px;align-items:stretch;margin-top:16px}.result{text-align:center}.result h2{font-size:19px;margin:0 0 12px}.donut{width:125px;height:125px;border-radius:50%;background:conic-gradient(var(--blue) 100%,#e2e8f0 0);position:relative;margin:7px auto 12px}.donut:after{content:"";position:absolute;inset:13px;background:white;border-radius:50%}.donut b{position:absolute;z-index:1;inset:0;display:grid;place-items:center;font-size:29px}.big{font-size:25px;font-weight:700}.muted{color:var(--muted);font-size:14px}.bridge{display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;color:var(--muted)}.bridge strong{font-size:20px;color:var(--text)}.arrow{font-size:25px;margin:6px}.danger{color:var(--red)!important}.gapblock{margin-top:12px;padding:10px;background:#fff1f2;border-radius:9px}.gapblock strong{display:block;font-size:31px}.gapbar{margin-top:15px}.gap-title{display:flex;justify-content:space-between;font-size:19px}.bar{display:flex;height:32px;margin-top:10px;border-radius:8px;overflow:hidden}.covered{background:var(--blue);color:white}.short{background:var(--red);color:white}.bar>div{display:flex;justify-content:center;align-items:center;white-space:nowrap;overflow:hidden;font-size:13px}.below{display:flex;justify-content:space-between;margin-top:9px}.below>div:last-child{text-align:right}.below strong{display:block}.secondary{display:flex;justify-content:center;gap:26px;margin-top:12px;color:var(--muted);font-size:13px}.quick{display:flex;gap:6px;margin-top:7px}.quick button{border:1px solid var(--border);border-radius:6px;background:#f8fafc;padding:5px 9px;cursor:pointer}.quick button.active{background:var(--text);color:white}.hidden{display:none!important}
@media(max-width:780px){.inputs,.scenarios{grid-template-columns:repeat(2,1fr)}.flow{grid-template-columns:1fr}.year-grid{grid-template-columns:repeat(3,1fr)}}

/* Fluid responsive layer; the stock/bond control and shared content hierarchy stay unchanged. */
html{overflow-x:hidden}body{padding:clamp(12px,2vw,24px);font-size:clamp(15px,1.45vw,16px);overflow-x:hidden}.wrap{min-width:0}.switch{width:min(330px,100%);margin-bottom:clamp(12px,1.8vw,18px)}.switch button{min-height:44px;font-size:clamp(15px,1.5vw,17px)}.card{padding:clamp(14px,2.3vw,24px);min-width:0}.inputs{grid-template-columns:repeat(4,minmax(0,1fr));gap:clamp(10px,1.5vw,18px)}.field{min-width:0}.field label{font-size:clamp(15px,1.55vw,17px)}.field input{min-width:0;font-size:clamp(18px,2vw,24px);padding:clamp(9px,1.2vw,12px)}.details-toggle{min-height:44px;font-size:clamp(15px,1.45vw,17px)}.year-grid{grid-template-columns:repeat(5,minmax(0,1fr));overscroll-behavior:contain}.year-cell{min-width:0}.year-cell input{min-width:0}.scenarios{grid-template-columns:repeat(4,minmax(0,1fr));gap:clamp(8px,1.2vw,12px)}.scenario{min-width:0;min-height:64px}.scenario strong{font-size:clamp(15px,1.45vw,17px)}.flow{grid-template-columns:minmax(0,1fr) minmax(110px,160px) minmax(0,1fr);gap:clamp(10px,1.5vw,18px)}.result h2,.gap-title{font-size:clamp(18px,2vw,23px)}.donut{width:clamp(108px,14vw,138px);height:clamp(108px,14vw,138px)}.donut b{font-size:clamp(28px,3vw,32px)}.big{font-size:clamp(21px,2.4vw,28px);overflow-wrap:anywhere}.muted{font-size:clamp(14px,1.4vw,16px)}.gapblock strong{font-size:clamp(30px,3.8vw,40px)}.gap-title,.below{gap:8px}.gap-title strong,.below strong{overflow-wrap:anywhere}.bar{max-width:100%}.quick{flex-wrap:wrap}.quick button{min-height:40px;min-width:52px}.secondary{flex-wrap:wrap}
@media(max-width:699px){.inputs{grid-template-columns:repeat(2,minmax(0,1fr))}.scenarios{grid-template-columns:repeat(2,minmax(0,1fr))}.year-grid{grid-template-columns:repeat(3,minmax(0,1fr))}.flow{grid-template-columns:minmax(0,1fr) minmax(80px,.55fr) minmax(0,1fr)}.bridge strong{font-size:17px}.donut{width:104px;height:104px}.card{border-radius:12px}}
@media(max-width:519px){.flow{grid-template-columns:1fr}.bridge{min-height:72px;padding:5px}.arrow{transform:rotate(90deg);margin:2px}.below>div{min-width:0;max-width:50%}}
</style></head><body><main class="wrap"><nav class="switch"><button id="stockTab" class="active">股票投資</button><button id="bondTab">債券收息</button></nav>
<section id="stockMode"><section class="card"><div class="inputs"><div class="field"><label>未來預期數字</label><input id="sTarget" value="8,000,000"></div><div class="field"><label>現有投資</label><input id="sCurrent" value="1,000,000"></div><div class="field"><label>每年投資</label><input id="sAnnual" value="200,000"></div><div class="field"><label>年期</label><input id="sYears" type="number" min="1" max="50" value="20"></div></div><button class="details-toggle" data-target="depositDetails">每年投資分開輸入 ▾</button><div id="depositDetails" class="details"><div id="depositGrid" class="year-grid"></div></div></section>
<section class="scenarios" id="scenarios"><button class="scenario" data-scenario="steady"><strong>平穩情景</strong><small>長期複合年化約2–3%</small></button><button class="scenario active" data-scenario="medium"><strong>中等情景</strong><small>長期複合年化約4–5%</small></button><button class="scenario" data-scenario="growth"><strong>高增長情景</strong><small>長期複合年化約7–8%</small></button><button class="scenario" data-scenario="custom"><strong>自訂情景</strong><small>按每年回報模擬</small></button></section>
<section class="card" style="margin-top:12px"><button class="details-toggle" data-target="returnDetails">睇每一年模擬升跌 ▾</button><div id="returnDetails" class="details"><div id="returnGrid" class="year-grid"></div><div class="summary"><span>模擬複合年化回報 CAGR<br><strong id="cagr"></strong></span><span>最高回報年份<br><strong id="maxYear"></strong></span><span>最低回報年份<br><strong id="minYear"></strong></span></div><p class="note">情景只用作展示不同市場升跌下的未來模擬效果，並非市場預測或保證回報。</p></div></section>
<section class="flow"><article class="card result"><h2>未來預期</h2><div class="donut"><b>100%</b></div><div class="big" id="sTargetOut"></div></article><div class="bridge"><strong id="sYearsBridge"></strong><div class="arrow">↓</div><strong id="scenarioName"></strong><span>模擬CAGR <b id="cagrBridge"></b></span></div><article class="card result"><h2>經歷升跌之後</h2><div class="muted">模擬未來結果</div><div class="big" id="finalValue"></div><div class="muted">已對應 <b id="sCoverage"></b></div><div class="gapblock danger">距離預期 <strong id="sGapPct"></strong><div class="big" id="sGap"></div></div></article></section><section class="card gapbar"><div class="gap-title"><span>未來預期</span><strong id="sBarTarget"></strong></div><div class="bar"><div class="covered" id="sCoveredBar"></div><div class="short" id="sShortBar"></div></div><div class="below"><div><strong id="sCoveredMoney"></strong><span class="muted">已對應</span></div><div><strong class="danger" id="sGapMoney"></strong><span class="muted">距離預期</span></div></div></section></section>
<section id="bondMode" class="hidden"><section class="card"><div class="inputs"><div class="field"><label>預期每月收息</label><input id="bExpected" value="20,000"></div><div class="field"><label>投入本金</label><input id="bPrincipal" value="3,000,000"></div><div class="field"><label>每年利息 (%)</label><input id="bRate" type="number" min="0" step="0.1" value="4"></div><div class="field"><label>年期</label><input id="bYears" type="number" min="1" max="50" value="10"><div class="quick"><button>3年</button><button>5年</button><button class="active">10年</button><button>30年</button></div></div></div></section><section class="flow"><article class="card result"><h2>原本預期</h2><div class="donut"><b>100%</b></div><div class="big"><span id="bExpectedOut"></span> / 月</div><div class="muted">每年即 <span id="bExpectedAnnual"></span></div></article><div class="bridge"><strong id="bYearsBridge"></strong><div class="arrow">↓</div><strong>每年利息 <span id="bRateBridge"></span>%</strong><span>本金 <b id="bPrincipalBridge"></b></span></div><article class="card result"><h2>按呢個債券模式</h2><div class="muted">實際平均每月收息</div><div class="big" id="bMonthly"></div><div class="muted">已對應 <b id="bCoverage"></b></div><div class="gapblock danger">距離預期 <strong id="bGapPct"></strong><div class="big"><span id="bGap"></span> / 月</div></div><div class="secondary"><span>每年收息 <b id="bAnnual"></b></span><span><b id="bTotalYears"></b>年合共收息 <b id="bTotal"></b></span></div></article></section><section class="card gapbar"><div class="gap-title"><span>每月預期收息</span><strong id="bBarExpected"></strong></div><div class="bar"><div class="covered" id="bCoveredBar"></div><div class="short" id="bShortBar"></div></div><div class="below"><div><strong id="bActualBottom"></strong><span class="muted">實際每月收息</span></div><div><strong class="danger" id="bGapBottom"></strong><span class="muted">仍相差 / 月</span></div></div></section></section>
</main><script>
const $=id=>document.getElementById(id),money=n=>'HK$'+Math.round(Math.max(0,n)).toLocaleString('en-US'),num=v=>Number(String(v).replace(/,/g,''))||0;const names={steady:'平穩情景',medium:'中等情景',growth:'高增長情景',custom:'自訂情景'};const patterns={steady:[4,-2,5,1,3,-1,6,2,4,1,3,-2,5,2,4,0,6,-1,3,2],medium:[10,-7,12,3,8,-5,15,2,7,-3,11,4,-8,14,5,1,9,-4,13,3],growth:[24,-16,19,8,-11,27,5,14,-18,22,9,-6,25,3,12,-13,28,7,-9,18]};let scenario='medium',returns=[],deposits=[],depositEdited=[];
function tune(base,target){const logs=base.map(x=>Math.log(1+x/100)),shift=Math.log(1+target)-logs.reduce((a,b)=>a+b,0)/base.length;return base.map(x=>(Math.exp(Math.log(1+x/100)+shift)-1)*100)}function ratesFor(type,n){const source=patterns[type],raw=Array.from({length:n},(_,i)=>source[i%source.length]+(i>=source.length?((i%3)-1)*.7:0));return tune(raw,{steady:.025,medium:.045,growth:.075}[type])}function syncYears(){const n=Math.max(1,Math.min(50,Math.round(num($('sYears').value))));$('sYears').value=n;const oldR=returns;returns=scenario==='custom'?Array.from({length:n},(_,i)=>oldR[i]??ratesFor('medium',n)[i]):ratesFor(scenario,n);deposits=Array.from({length:n},(_,i)=>depositEdited[i]?deposits[i]:num($('sAnnual').value));depositEdited.length=n;renderYears();updateStock()}
function renderYears(){$('depositGrid').innerHTML=deposits.map((v,i)=>`<div class="year-cell"><label>第${i+1}年</label><input class="dep" data-i="${i}" value="${Math.round(v).toLocaleString()}"></div>`).join('');$('returnGrid').innerHTML=returns.map((v,i)=>`<div class="year-cell"><label>第${i+1}年</label><input class="ret" data-i="${i}" type="number" step="0.1" value="${v.toFixed(1)}"></div>`).join('');document.querySelectorAll('.dep').forEach(el=>el.oninput=()=>{const i=+el.dataset.i;deposits[i]=num(el.value);depositEdited[i]=true;updateStock()});document.querySelectorAll('.ret').forEach(el=>el.oninput=()=>{returns[+el.dataset.i]=num(el.value);setScenario('custom',false);updateStock()})}
function setScenario(s,regen=true){scenario=s;document.querySelectorAll('.scenario').forEach(b=>b.classList.toggle('active',b.dataset.scenario===s));if(regen&&s!=='custom'){returns=ratesFor(s,Math.max(1,num($('sYears').value)));renderYears()}updateStock()}
function updateStock(){let value=num($('sCurrent').value);returns.forEach((r,i)=>value=(value+(deposits[i]||0))*(1+r/100));const target=num($('sTarget').value),coverage=target?Math.min(100,value/target*100):0,gap=Math.max(0,target-value),gapPct=Math.max(0,100-coverage),cagr=returns.length?(Math.pow(returns.reduce((p,r)=>p*(1+r/100),1),1/returns.length)-1)*100:0,max=Math.max(...returns),min=Math.min(...returns);$('cagr').textContent=cagr.toFixed(1)+'%';$('maxYear').textContent='第'+(returns.indexOf(max)+1)+'年 '+(max>=0?'+':'')+max.toFixed(1)+'%';$('minYear').textContent='第'+(returns.indexOf(min)+1)+'年 '+(min>=0?'+':'')+min.toFixed(1)+'%';$('sTargetOut').textContent=$('sBarTarget').textContent=money(target);$('sYearsBridge').textContent=returns.length+'年';$('scenarioName').textContent=names[scenario];$('cagrBridge').textContent=cagr.toFixed(1)+'%';$('finalValue').textContent=money(value);$('sCoverage').textContent=Math.round(coverage)+'%';$('sGapPct').textContent=Math.round(gapPct)+'%';$('sGap').textContent=$('sGapMoney').textContent=money(gap);$('sCoveredMoney').textContent=money(Math.min(value,target));$('sCoveredBar').style.width=coverage+'%';$('sShortBar').style.width=gapPct+'%';$('sCoveredBar').textContent='已對應 '+Math.round(coverage)+'%';$('sShortBar').textContent=gapPct?'距離預期 '+Math.round(gapPct)+'%':''}
function updateBond(){const expected=num($('bExpected').value),principal=num($('bPrincipal').value),rate=num($('bRate').value)/100,years=num($('bYears').value),annual=principal*rate,monthly=annual/12,total=annual*years,coverage=expected?Math.min(100,monthly/expected*100):0,gap=Math.max(0,expected-monthly),gapPct=Math.max(0,100-coverage);$('bExpectedOut').textContent=$('bBarExpected').textContent=money(expected);$('bExpectedAnnual').textContent=money(expected*12);$('bYearsBridge').textContent=years+'年';$('bRateBridge').textContent=(rate*100).toFixed(1);$('bPrincipalBridge').textContent=money(principal);$('bMonthly').textContent=$('bActualBottom').textContent=money(monthly);$('bCoverage').textContent=Math.round(coverage)+'%';$('bGapPct').textContent=Math.round(gapPct)+'%';$('bGap').textContent=$('bGapBottom').textContent=money(gap);$('bAnnual').textContent=money(annual);$('bTotalYears').textContent=years;$('bTotal').textContent=money(total);$('bCoveredBar').style.width=coverage+'%';$('bShortBar').style.width=gapPct+'%';$('bCoveredBar').textContent='已對應 '+Math.round(coverage)+'%';$('bShortBar').textContent=gapPct?'距離預期 '+Math.round(gapPct)+'%':'';document.querySelectorAll('.quick button').forEach(b=>b.classList.toggle('active',parseInt(b.textContent,10)===years))}
function cashInput(el,cb){el.oninput=()=>{const v=num(el.value);el.value=el.value===''?'':Math.round(v).toLocaleString();cb()}}document.querySelectorAll('.details-toggle').forEach(b=>b.onclick=()=>$(b.dataset.target).classList.toggle('open'));document.querySelectorAll('.scenario').forEach(b=>b.onclick=()=>setScenario(b.dataset.scenario));cashInput($('sTarget'),updateStock);cashInput($('sCurrent'),updateStock);cashInput($('sAnnual'),()=>{deposits=deposits.map((v,i)=>depositEdited[i]?v:num($('sAnnual').value));renderYears();updateStock()});$('sYears').oninput=syncYears;cashInput($('bExpected'),updateBond);cashInput($('bPrincipal'),updateBond);[$('bRate'),$('bYears')].forEach(el=>el.oninput=updateBond);document.querySelectorAll('.quick button').forEach(b=>b.onclick=()=>{$('bYears').value=parseInt(b.textContent,10);updateBond()});function mode(stock){$('stockMode').classList.toggle('hidden',!stock);$('bondMode').classList.toggle('hidden',stock);$('stockTab').classList.toggle('active',stock);$('bondTab').classList.toggle('active',!stock)}$('stockTab').onclick=()=>mode(true);$('bondTab').onclick=()=>mode(false);syncYears();updateBond();
</script></body></html>
