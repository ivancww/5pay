<!DOCTYPE html><html lang="zh-HK"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>安全 × 靈活 × 增長</title><style>
:root{--bg:#f8fafc;--card:#fff;--border:#e2e8f0;--text:#0f172a;--muted:#64748b;--accent:#4f46e5;--active:#10b981}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:24px 16px}.wrap{max-width:1060px;margin:auto}.hero h1{font-size:27px;margin:0 0 7px}.hero p{font-size:16px;color:var(--muted);margin:0 0 18px}.choices,.tools{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.choice,.tool{background:white;border:1px solid var(--border);border-radius:14px;padding:17px}.choice{cursor:pointer;text-align:left}.choice.active{border:2px solid var(--accent);background:#eef2ff}.choice strong{display:block;font-size:19px;margin-bottom:7px}.choice span,.tool p{font-size:15px;line-height:1.5;color:var(--muted)}.message{background:white;border:1px solid var(--border);border-radius:14px;padding:15px;text-align:center;margin-top:15px;min-height:76px}.message strong{font-size:19px}.sum{color:var(--accent);font-size:20px;margin:5px}.triangle-card{background:white;border:1px solid var(--border);border-radius:14px;margin-top:15px;padding:18px}.triangle{width:min(600px,90%);display:block;margin:auto}.edge{stroke:#cbd5e1;stroke-width:5;transition:.2s}.edge.active{stroke:var(--accent);stroke-width:9}.vertex{fill:white;stroke:#94a3b8;stroke-width:3}.vertex.active{fill:#eef2ff;stroke:var(--accent);stroke-width:5}.vlabel{font-size:17px;font-weight:650;fill:var(--text)}.elabel{font-size:14px;fill:var(--muted)}.tools{margin-top:15px}.tool{min-width:0;transition:.2s}.tool.active{border:2px solid var(--accent);background:#eef2ff}.tool .pair{font-size:14px;color:var(--accent);font-weight:650}.tool h2{font-size:19px;margin:7px 0}.conclusion{text-align:center;margin:17px 0 0;color:#334155;font-size:16px;line-height:1.6}.final{font-weight:600}.hidden{display:none}@media(max-width:650px){.choices{grid-template-columns:1fr}.tools{grid-template-columns:repeat(3,minmax(230px,1fr));overflow-x:auto}.hero h1{font-size:23px}}

/* Keep the three-way relationship visible wherever the viewport can contain it. */
html{overflow-x:hidden}body{padding:clamp(12px,2vw,24px);font-size:clamp(15px,1.45vw,16px);overflow-x:hidden}.wrap{min-width:0}.choices,.tools{grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(8px,1.5vw,18px)}.choice,.tool,.triangle-card,.message{padding:clamp(12px,2.2vw,24px);min-width:0}.choice{min-height:88px}.choice strong,.message strong,.tool h2{font-size:clamp(17px,1.9vw,23px)}.choice span,.tool p,.conclusion{font-size:clamp(14px,1.45vw,16px)}.sum{font-size:clamp(18px,2vw,24px)}.triangle{width:min(620px,100%);height:auto}.vlabel{font-size:clamp(16px,2vw,19px)}.elabel{font-size:clamp(13px,1.5vw,15px)}
@media(max-width:699px){.choices,.tools{grid-template-columns:repeat(3,minmax(0,1fr))}.choice,.tool{padding:12px 10px}.choice strong,.tool h2{font-size:17px}.choice span,.tool p{font-size:14px}.triangle-card{padding:10px}.tools{overflow:visible}}
@media(max-width:419px){.choice span{font-size:13px}.tools{grid-template-columns:1fr}.tool{padding:14px}.tool p br{display:none}}
</style></head><body><main class="wrap"><section class="choices"><button class="choice active" data-choice="safe"><strong>安全穩定</strong><span>希望唔會因市場升跌，大幅影響原本安排。</span></button><button class="choice" data-choice="flex"><strong>靈活運用</strong><span>有需要時，希望可以較容易調動。</span></button><button class="choice" data-choice="growth"><strong>增長回報</strong><span>希望長時間有較高增長空間。</span></button></section><section class="message" id="message"></section>
<section class="triangle-card"><svg class="triangle" viewBox="0 0 650 390" role="img" aria-label="安全、靈活、增長鐵三角"><line id="edgeSafeGrowth" class="edge" x1="325" y1="55" x2="95" y2="330"/><line id="edgeFlexGrowth" class="edge" x1="325" y1="55" x2="555" y2="330"/><line id="edgeSafeFlex" class="edge" x1="95" y1="330" x2="555" y2="330"/><circle id="vertexGrowth" class="vertex" cx="325" cy="55" r="17"/><circle id="vertexSafe" class="vertex" cx="95" cy="330" r="17"/><circle id="vertexFlex" class="vertex" cx="555" cy="330" r="17"/><text class="vlabel" x="325" y="25" text-anchor="middle">增長回報</text><text class="vlabel" x="85" y="370" text-anchor="middle">安全穩定</text><text class="vlabel" x="565" y="370" text-anchor="middle">靈活運用</text><text class="elabel" x="172" y="174" text-anchor="middle">安全 ＋ 增長</text><text class="elabel" x="478" y="174" text-anchor="middle">靈活 ＋ 增長</text><text class="elabel" x="325" y="318" text-anchor="middle">安全 ＋ 靈活</text></svg></section>
<section class="tools"><article class="tool" id="toolSafeFlex"><div class="pair">安全 ＋ 靈活</div><h2>銀行現金類</h2><p>較容易調動，同時較重視穩定；<br>增長空間通常需要取捨。</p></article><article class="tool" id="toolSafeGrowth"><div class="pair">安全 ＋ 增長</div><h2>定期／債券類</h2><p>較重視穩定，同時有一定利息／回報；<br>靈活性通常需要取捨。</p></article><article class="tool" id="toolFlexGrowth"><div class="pair">靈活 ＋ 增長</div><h2>股票／ETF類</h2><p>有增長空間及買賣彈性；<br>價值會隨市場升跌，穩定程度需要取捨。</p></article></section><p class="conclusion" id="conclusion">每一種方法都有自己的角色，而你真正需要思考的是自己最重視哪兩個方向。</p></main><script>
const message=document.getElementById('message'),conclusion=document.getElementById('conclusion');const selected=new Set(['safe']);const labels={safe:'安全',flex:'靈活',growth:'增長'};const pairs=[['safe','flex','edgeSafeFlex','toolSafeFlex'],['safe','growth','edgeSafeGrowth','toolSafeGrowth'],['flex','growth','edgeFlexGrowth','toolFlexGrowth']];function render(){document.querySelectorAll('.choice').forEach(b=>b.classList.toggle('active',selected.has(b.dataset.choice)));['safe','flex','growth'].forEach(x=>document.getElementById('vertex'+x[0].toUpperCase()+x.slice(1)).classList.toggle('active',selected.has(x)));pairs.forEach(([a,b,e,t])=>{const on=selected.size===2&&selected.has(a)&&selected.has(b);document.getElementById(e).classList.toggle('active',on);document.getElementById(t).classList.toggle('active',on)});if(selected.size===3){message.innerHTML='<span>你希望同時擁有</span><div class="sum">安全 ＋ 靈活 ＋ 增長</div><strong>↓<br>如果三樣都想要呢？<br>單一工具通常需要作出取捨</strong>';conclusion.innerHTML='三樣都重要，但不同工具各自有不同側重。<br><span class="final">重點唔係邊一種最好，而係安全、靈活同增長之間點樣取捨。</span>'}else{const text=[...selected].map(x=>labels[x]).join(' ＋ ');message.innerHTML=text?`你目前重視：<strong>${text}</strong><br><span class="muted">不同工具有不同側重，需要取捨。</span>`:'揀選你真正重視嘅方向。';conclusion.textContent='每一種方法都有自己的角色，而你真正需要思考的是自己最重視哪兩個方向。'}}document.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{const c=b.dataset.choice;selected.has(c)?selected.delete(c):selected.add(c);render()});render();
</script></body></html>
