<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>未來準備 × 時間 × 通脹</title>
  <style>
    :root{--bg:#f8fafc;--card:#fff;--border:#e2e8f0;--text:#0f172a;--muted:#64748b;--blue:#0284c7;--green:#10b981;--red:#ef4444}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:24px 16px}.wrap{max-width:980px;margin:auto}.hero{margin-bottom:20px}.hero h1{font-size:28px;margin:0 0 7px}.hero p{margin:0;color:var(--muted);font-size:16px}.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px}.inputs{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin-bottom:16px}.field label{display:flex;align-items:center;gap:5px;color:var(--muted);font-size:14px;margin-bottom:6px}.field input{width:100%;border:1px solid var(--border);border-radius:8px;padding:10px;font-size:18px;font-weight:600;color:var(--text)}.info{border:1px solid #bae6fd;background:#f0f9ff;color:#0369a1;width:20px;height:20px;border-radius:50%;cursor:pointer}.tips{display:none;margin-top:10px;padding:12px;border:1px solid #bae6fd;border-radius:9px;background:#f0f9ff;color:#334155;font-size:15px}.tips.show{display:block}.tips p{margin:4px 0}.flow{display:grid;grid-template-columns:1fr 150px 1fr;gap:14px;align-items:stretch}.result{text-align:center}.result h2{font-size:19px;margin:0 0 12px}.donut{--pct:0;width:132px;height:132px;margin:4px auto 15px;border-radius:50%;background:conic-gradient(var(--blue) calc(var(--pct)*1%),#e2e8f0 0);position:relative}.donut:after{content:"";position:absolute;inset:13px;background:white;border-radius:50%}.donut-text{position:absolute;inset:0;display:grid;place-content:center;z-index:1}.donut-text strong{font-size:30px}.donut-text span{font-size:12px;color:var(--muted)}.label{font-size:14px;color:var(--muted)}.money{font-size:21px;font-weight:650;margin-top:4px}.bridge{display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--muted)}.bridge strong{font-size:21px;color:var(--text)}.arrow{font-size:25px;margin:7px}.rate{display:flex;align-items:center}.rate input{width:68px;text-align:right;font-size:18px;padding:6px;border:1px solid var(--border);border-radius:7px;font-weight:650}.bridge small{margin-top:4px}.actual{font-size:15px;color:var(--muted);margin-top:8px}.actual strong{font-size:29px;color:var(--text)}.gap{background:#fff1f2;border-radius:10px;margin-top:13px;padding:11px;color:var(--red)}.gap strong{display:block;font-size:33px}.gap .gap-money{font-size:23px}.gapbar{margin-top:16px}.gap-head{display:flex;justify-content:space-between;align-items:end;margin-bottom:11px}.gap-head h2{font-size:19px;margin:0}.gap-head strong{font-size:22px}.bar{display:flex;height:34px;border-radius:8px;overflow:hidden;background:#e2e8f0}.ready,.missing{display:flex;align-items:center;justify-content:center;color:white;font-size:14px;white-space:nowrap;overflow:hidden;transition:width .25s}.ready{background:var(--blue)}.missing{background:var(--red)}.bar-details{display:flex;justify-content:space-between;margin-top:10px}.bar-details>div:last-child{text-align:right}.bar-details strong{display:block;font-size:18px}.danger{color:var(--red)}.bar-details span{font-size:13px;color:var(--muted)}
    @media(max-width:760px){.inputs{grid-template-columns:repeat(2,1fr)}.flow{grid-template-columns:1fr}.bridge{padding:8px}.hero h1{font-size:24px}}

    /* Fluid type and spacing: shared layout scales between compact and iPad widths. */
    html{overflow-x:hidden}body{padding:clamp(12px,2vw,24px);font-size:clamp(15px,1.45vw,16px);overflow-x:hidden}.wrap{min-width:0}.card{padding:clamp(14px,2.3vw,24px);min-width:0}.inputs{grid-template-columns:repeat(4,minmax(0,1fr));gap:clamp(10px,1.5vw,18px);margin-bottom:0}.field{min-width:0}.field label{font-size:clamp(15px,1.55vw,17px)}.field input{min-width:0;font-size:clamp(18px,2vw,24px);padding:clamp(9px,1.2vw,12px)}.info{width:28px;height:28px;flex:0 0 28px}.tips{font-size:clamp(15px,1.45vw,16px)}.flow{grid-template-columns:minmax(0,1fr) minmax(110px,150px) minmax(0,1fr);gap:clamp(10px,1.5vw,18px)}.result h2,.gap-head h2{font-size:clamp(18px,2vw,23px)}.donut{width:clamp(112px,15vw,144px);height:clamp(112px,15vw,144px)}.donut-text strong,.actual strong{font-size:clamp(28px,3vw,32px)}.label,.actual{font-size:clamp(14px,1.4vw,16px)}.money,.gap .gap-money,.gap-head strong{font-size:clamp(19px,2.2vw,25px);overflow-wrap:anywhere}.gap strong{font-size:clamp(30px,3.8vw,40px)}.bar{max-width:100%}.bar-details strong{font-size:clamp(16px,1.9vw,21px);overflow-wrap:anywhere}.ready,.missing{font-size:clamp(12px,1.3vw,15px)}
    @media(max-width:699px){.inputs{grid-template-columns:repeat(2,minmax(0,1fr))}.flow{grid-template-columns:minmax(0,1fr) minmax(80px,.55fr) minmax(0,1fr)}.bridge strong{font-size:17px}.donut{width:108px;height:108px}.card{border-radius:12px}}
    @media(max-width:519px){.flow{grid-template-columns:1fr}.bridge{padding:6px;min-height:72px}.arrow{transform:rotate(90deg);margin:2px}.gap-head{align-items:flex-start;gap:8px}.gap-head strong{text-align:right}.bar-details{gap:8px}.bar-details>div{min-width:0}}
  </style>
</head><body><main class="wrap">

  <section class="card inputs-card"><div class="inputs">
    <div class="field"><label>未來預期數字 <button class="info" id="infoBtn" aria-label="顯示提示" aria-expanded="false">i</button></label><input id="target" inputmode="numeric" value="10,000,000"></div>
    <div class="field"><label>現有準備</label><input id="current" inputmode="numeric" value="2,000,000"></div>
    <div class="field"><label>每年累積</label><input id="annual" inputmode="numeric" value="300,000"></div>
    <div class="field"><label>年期</label><input id="years" type="number" min="1" max="60" value="20"></div>
  </div><div class="tips" id="tips"><p>1. 如果諗下將來嘅生活，你預期每月大概需要幾多先會覺得舒服？</p><p>2. 如果想將來多一份底氣／額外現金流，你希望每月大概有幾多？</p></div></section>
  <section class="flow" style="margin-top:16px">
    <article class="card result"><h2>原本預期</h2><div class="donut" id="originalDonut"><div class="donut-text"><strong id="originalPct">0%</strong><span>原本 Coverage</span></div></div><div class="label">預計累積</div><div class="money" id="accumulated"></div></article>
    <div class="bridge"><strong id="bridgeYears">20年</strong><div class="arrow">↓</div><div class="rate"><input id="inflation" type="number" value="2.5" min="0" step="0.1"><strong>%</strong></div><small>每年平均通脹</small></div>
    <article class="card result"><h2>將時間放入去</h2><div class="actual">實際已準備 <strong id="futurePct">0%</strong></div><div class="label">已準備</div><div class="money" id="readyMoney"></div><div class="gap"><span>未準備</span><strong id="gapPct">0%</strong><div class="gap-money" id="gapMoney"></div></div></article>
  </section>
  <section class="card gapbar"><div class="gap-head"><h2>未來真正需要</h2><strong id="futureRequired"></strong></div><div class="bar"><div class="ready" id="readyBar"></div><div class="missing" id="gapBar"></div></div><div class="bar-details"><div><strong id="readyBottom"></strong><span>已準備</span></div><div><strong class="danger" id="gapBottom"></strong><span>未準備</span></div></div></section>
</main><script>
  const money=n=>'HK$'+Math.round(Math.max(0,n)).toLocaleString('en-US');
  const number=v=>Number(String(v).replace(/,/g,''))||0;
  function formatInput(el){const n=number(el.value);el.value=el.value===''?'':Math.round(n).toLocaleString('en-US')}
  function update(){const target=number(targetEl.value),current=number(currentEl.value),annual=number(annualEl.value),years=Math.max(0,number(yearsEl.value)),rate=Math.max(0,number(inflationEl.value))/100;const accumulated=current+annual*years;const futureRequired=target*Math.pow(1+rate,years);const originalCoverage=target?Math.min(100,accumulated/target*100):0;const futureCoverage=futureRequired?Math.min(100,accumulated/futureRequired*100):0;const gap=Math.max(0,futureRequired-accumulated);const gapPercentage=Math.max(0,100-futureCoverage);originalPct.textContent=Math.round(originalCoverage)+'%';originalDonut.style.setProperty('--pct',originalCoverage);accumulatedEl.textContent=money(accumulated);bridgeYears.textContent=years+'年';futurePct.textContent=Math.round(futureCoverage)+'%';readyMoney.textContent=money(Math.min(accumulated,futureRequired));gapPct.textContent=Math.round(gapPercentage)+'%';gapMoney.textContent=money(gap);futureRequiredEl.textContent=money(futureRequired);readyBar.style.width=futureCoverage+'%';gapBar.style.width=gapPercentage+'%';readyBar.textContent='已準備 '+Math.round(futureCoverage)+'%';gapBar.textContent=gapPercentage>0?'未準備 '+Math.round(gapPercentage)+'%':'';readyBottom.textContent=money(Math.min(accumulated,futureRequired));gapBottom.textContent=money(gap)}
  ['originalPct','originalDonut','bridgeYears','futurePct','readyMoney','gapPct','gapMoney','readyBar','gapBar','readyBottom','gapBottom','infoBtn','tips'].forEach(id=>window[id]=document.getElementById(id));
  const targetEl=document.getElementById('target'),currentEl=document.getElementById('current'),annualEl=document.getElementById('annual'),yearsEl=document.getElementById('years'),inflationEl=document.getElementById('inflation'),accumulatedEl=document.getElementById('accumulated'),futureRequiredEl=document.getElementById('futureRequired');
  [targetEl,currentEl,annualEl].forEach(el=>el.addEventListener('input',()=>{formatInput(el);update()}));[yearsEl,inflationEl].forEach(el=>el.addEventListener('input',update));infoBtn.addEventListener('click',()=>{const shown=tips.classList.toggle('show');infoBtn.setAttribute('aria-expanded',shown)});update();
</script></body></html>
